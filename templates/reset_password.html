<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet"><title>Reset Password - Birthdays</title></head>
<body><div class="header"><h1>Birthdays</h1></div><div class="container">
{% for message in get_flashed_messages() %}<p class="notice">{{ message }}</p>{% endfor %}
<div class="section"><h2>Reset Password</h2><form action="{{ url_for('reset_password', token=token) }}" method="post" class="auth-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<input name="new_password" type="password" placeholder="New password (8+ characters)" minlength="8" required autocomplete="new-password">
<input name="confirm_password" type="password" placeholder="Confirm new password" minlength="8" required autocomplete="new-password">
<input type="submit" value="Reset Password"></form></div></div></body></html>
